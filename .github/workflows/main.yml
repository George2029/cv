name: Deploy
on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # Build both images on GitHub's runners and push them to GitHub Container Registry.
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: .
          - name: nginx
            context: ./front
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/george2029/cv-${{ matrix.name }}:latest
            ghcr.io/george2029/cv-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Once both images are pushed, tell the server to pull them and restart.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy webhook
        env:
          URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: |
          payload=$(jq -nc --arg ref "$GITHUB_REF" --arg sha "$GITHUB_SHA" '{ref:$ref, sha:$sha}')
          sig="sha256=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$SECRET" | awk '{print $NF}')"
          curl -fsS --max-time 30 -X POST "$URL" \
            -H "Content-Type: application/json" \
            -H "X-Signature: $sig" \
            -d "$payload"
