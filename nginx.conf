user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

stream {
    map $ssl_preread_server_name $backend_name {
        vegano.chickenkiller.com    my_local_service;

        default                     xray_backend;
    }

    upstream xray_backend {
        server 127.0.0.1:23212;
    }

    upstream my_local_service {
        server 127.0.0.1:7777;
    }

    server {
        listen 443;
        listen [::]:443;

        ssl_preread on;
        proxy_pass $backend_name;

        proxy_timeout 1h;
        proxy_connect_timeout 5s;
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 127.0.0.1:7777 ssl;
        server_name vegano.chickenkiller.com;

        ssl_certificate     /etc/letsencrypt/live/vegano.chickenkiller.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/vegano.chickenkiller.com/privkey.pem;

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
